id: raffles-two-ships-peerless
title: Which Peerless?

case:
  name: Raffles v. Wichelhaus
  citation: 2 Hurl. & C. 906
  parallel_citations: ["159 Eng. Rep. 375"]
  court: Court of Exchequer
  jurisdiction: UK
  date: "1864-01-20"
  judge: >
    Pollock C.B. and Martin B. intervened from the bench. No judgment was written.
    The report ends "Per Curiam. Judgment for the defendants."
  prior_history: >
    Decided on demurrer to the plea, so the two-ships fact was admitted for the
    purposes of argument rather than tried.

instrument:
  type: contract
  provision: Sale of 125 bales of Surat cotton, pleaded in the declaration
  drafted_by: >
    The parties, neither of whom knew that two ships of the name were about to
    sail from Bombay.

mechanism:
  primary: latent-ambiguity
  secondary: [equivocation]

disputed_text:
  quote: >
    ... certain goods, to wit, 125 bales of Surat cotton, guaranteed middling fair
    merchant's dhollorah, to arrive ex Peerless from Bombay; and that the cotton
    should be taken from the quay, and that the defendants would pay the plaintiff
    for the same at a certain rate, to wit, at the rate of 17.25 d. per pound,
    within a certain time then agreed upon after the arrival of said goods in
    England.
  locus: >
    the ship's name "Peerless", which on the face of the contract picks out one
    vessel and in fact picked out two, one sailing from Bombay in October and one
    in December
readings:
  - id: A
    advanced_by: Wichelhaus and others, the buyers
    statement: >
      The contract named the Peerless that sailed in October. Cotton arriving on a
      later ship of the same name does not answer it, and the buyers need not take
      it.
  - id: B
    advanced_by: Raffles, the seller
    statement: >
      The subject of the sale is cotton of a stated description, not a particular
      voyage. It is immaterial which Peerless carried it, so long as a ship of that
      name did.

decisions:
  - court: Court of Exchequer
    known_from: read
    citation: 2 Hurl. & C. 906
    date: "1864-01-20"
    adopted: none
    declared_ambiguous: true
    disposition: first-instance
    quote: >
      He was then stopped by the Court. Per Curiam. Judgment for the defendants.
    pinpoint: the close of the report

resolution:
  outcome: >
    no-contract. Neither reading prevailed. Judgment went to the defendants on the
    ground argued for them, that there was no consensus ad idem.
  basis: [no-consensus-ad-idem, extrinsic-evidence]
  court_declared_ambiguous: true
  quote: >
    He was then stopped by the Court. Per Curiam. Judgment for the defendants.
stakes:
  kind: money
  amount: 125 bales of Surat cotton at 17.25d per pound
  note: >
    The rate and quantity are pleaded in the declaration. The report states no
    damages figure, the case having been decided on demurrer.
  documented: true

preventive_edits:
  - forces: A
    edit: >
      Name the sailing: "to arrive ex Peerless from Bombay, sailing in October".
    plausible_intent: true
    changes_bargain: >
      Fixes the arrival the buyer was counting on and leaves the risk of a later
      shipment with the seller.
  - forces: B
    edit: >
      Say the vessel is immaterial: "to arrive from Bombay ex any vessel named
      Peerless", or drop the vessel and sell against the description alone.
    plausible_intent: true
    changes_bargain: >
      Makes it a sale by description with no fixed arrival, shifting timing risk to the
      buyer. That was the seller's case, and it is an ordinary commercial term rather
      than an absurd one.

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  boundary:
    tests: [mutual-mistake, facts-required-to-surface]
    against_inclusion: >
      The case is taught as mutual mistake rather than interpretation, and mistake is
      excluded. The judgment supports that: counsel's winning argument was that there was
      no consensus ad idem, which is a proposition about the parties' minds and not about
      the words. Worse for inclusion, nothing on the face of the contract is unclear. The
      second reading appears only once you learn two ships bore the name, which is the
      fact-dependence that test (b) exists to keep out.
    why_included: >
      Test (b) asks whether an edit made in advance, knowing nothing of what later
      happened, would have prevented the dispute. Naming the sailing month does exactly
      that. The decisive point is timing: "Peerless" had two referents at the moment of
      drafting, and it was only the parties' knowledge that arrived late. The ambiguity
      was in the text from the start, waiting.
  notes: >
    The exhibit that stretches test (a) furthest, though it plainly satisfies it.
    Two readings exist because "Peerless" picked out two vessels at the moment of
    drafting. Neither is visible on the face of the contract. The second
    reading exists only once you learn there were two ships, so the ambiguity is
    invisible from the text alone, and the case is conventionally taught as mutual
    mistake rather than interpretation. It passes test (b) cleanly, since naming
    the sailing month is a text-only fix that requires no knowledge of what later
    happened, and it strains test (a). It is here because a criterion applied only
    to easy cases is not a criterion.
    The report repays reading in full for a second reason. The court gave no
    reasons at all. Everything the case is cited for comes from Mellish's argument
    for the defendants, that "the moment it appears that two ships called the
    Peerless were about to sail from Bombay there is a latent ambiguity, and parol
    evidence may be given", and that consequently "there was no consensus ad
    idem, and therefore no binding contract". He was stopped mid-argument and
    judgment followed. The doctrine is counsel's, adopted in silence. The nearest
    thing to judicial reasoning is Pollock C.B. interjecting that "it would be a
    question for the jury whether both parties meant the same ship to be called
    the Peerless", and likening the case to a purchase of wine from a named estate
    "in Spain or France, where there are two estates of the same name". The
    court_declared_ambiguous flag is set true on the strength of the court
    stopping counsel, not on any statement, because there is no statement.

