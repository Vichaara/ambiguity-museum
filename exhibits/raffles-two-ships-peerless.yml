verification:
  status: confirmed
  checked_on: "2026-07-29"
  open_questions:
    - >
      The report text was read in full, including the declaration, the plea,
      counsel on both sides and the interjections from the bench. The reproduction
      carries casebook pagination (348 to 350) rather than English Reports
      pagination, so it confirms the text of 2 Hurl. & C. 906 but not the 159 Eng.
      Rep. 375 page number, which rests on the second source.
    - >
      The reproduction prints "consensus ad item" where the phrase is consensus ad
      idem. Treated as a typographical slip in that printing and not reproduced in
      the quoted material here. Check an English Reports facsimile before quoting
      that sentence verbatim anywhere.

