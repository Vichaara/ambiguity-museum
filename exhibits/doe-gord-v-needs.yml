id: doe-gord-v-needs
title: Which George Gord?

case:
  name: Doe d. Gord v. Needs
  citation: (1836) 2 M & W 129
  parallel_citations: ["150 ER 698"]
  court: Court of Exchequer
  jurisdiction: UK
  date: "1836-01-01"
  prior_history: >
    Date is the reported year only; the precise decision date was not confirmed.

instrument:
  type: will
  provision: Devise of a house under a will dated March 1807
  drafted_by: The testator

mechanism:
  primary: equivocation
  secondary: [latent-ambiguity]

disputed_text:
  quote: >
    ... George Gord, the son of Gord ...
  locus: >
    a description that fitted two different people equally well. The testator
    having elsewhere in the same will devised property to "John Gord, the son of
    George Gord" and to "George Gord, the son of George Gord"

readings:
  - id: A
    statement: >
      The devise was to George Gord the son of George Gord.
  - id: B
    statement: >
      The devise was to George Gord the son of John Gord.

resolution:
  outcome: >
    unresolved on the face of the will; extrinsic evidence of the testator's
    declarations of intention was admitted to identify the devisee
  basis: [extrinsic-evidence]
  court_declared_ambiguous: true
  quote: >
    PENDING — see verification. Quote the reported judgment before publishing.

stakes:
  kind: property
  note: A devised house. No valuation appears in the accounts consulted.
  documented: false

minimal_fix:
  edit: >
    Complete the description. "George Gord, the son of John Gord, of [parish]"
    identifies one person and no other.
  suffices_without_facts: true

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  boundary: true
  notes: >
    Included as the wills counterpart to raffles-two-ships-peerless: the same
    mechanism (one description, two real-world referents) in a different
    instrument, twenty-eight years earlier. The pairing is the point: equivocation
    turns up whenever a name is assumed to pick out exactly one thing, in any
    century and any kind of drafting. The remedy differs from Raffles, though. A
    will admits declarations of intention, where the contract simply failed.

sources:
  - url: https://vlex.co.uk/vid/doe-d-george-gord-803311113
    kind: secondary
    confirms: [citation]
    retrieved: "2026-07-29"

verification:
  status: needs-primary
  checked_on: "2026-07-29"
  open_questions:
    - >
      The weakest-sourced exhibit in the collection. Citation appears consistently
      as (1836) 2 M & W 129; 150 ER 698, but the report itself was not read.
    - >
      disputed_text is a reconstruction from secondary descriptions of the will's
      devises and is very likely not the testator's exact words. Replace it with
      the reported wording or drop the exhibit.
    - >
      Confirm the precise decision date, the identity of the competing devisees,
      and whether the court admitted declarations of intention as stated here.
    - >
      If the report cannot be reached, consider substituting a better-documented
      equivocation case rather than publishing this one.

pairs_with: [raffles-two-ships-peerless]
tags: [will, succession, equivocation, boundary, needs-primary]
