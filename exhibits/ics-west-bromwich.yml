id: ics-west-bromwich
title: May a court move the brackets?

case:
  name: Investors Compensation Scheme Ltd v West Bromwich Building Society
  citation: "[1998] 1 WLR 896"
  parallel_citations: ["[1997] UKHL 28", "[1998] 1 All ER 98"]
  court: House of Lords
  jurisdiction: UK
  date: "1997-06-19"
  judge: >
    Lord Hoffmann, with Lord Goff of Chieveley, Lord Hope of Craighead and Lord
    Clyde concurring. Lord Lloyd of Berwick dissented on the construction of
    section 3(b), though he agreed with the House on the separate question of the
    claim against the solicitors.
  prior_history: >
    Evans-Lombe J. read the clause in the investors' favour but doubted himself,
    saying he was doing violence to the natural meaning and acting in a way "more
    appropriate to rectification than the process of construction". The Court of
    Appeal reversed him, Leggatt L.J. holding on the authority of Alice Through
    the Looking Glass that his reading was "not an available meaning of the
    words". The House of Lords restored the judge.

instrument:
  type: contract
  provision: Section 3(b) of the Investors Compensation Scheme claim form
  drafted_by: >
    The Investors Compensation Scheme, the assignee, which then had to argue its
    own form did not mean what it appeared to say. Hoffmann called it "one badly
    drafted clause which is happily no longer in use".

mechanism:
  primary: punctuation-scope
  secondary: [modifier-scope]

disputed_text:
  quote: >
    Any claim (whether sounding in rescission for undue influence or otherwise)
    that you have or may have against the West Bromwich Building Society in which
    you claim an abatement of sums which you would otherwise have to repay to that
    Society in respect of sums borrowed by you from that Society in connection
    with the transaction and dealings giving rise to the claim (including interest
    on any such sums).
  locus: >
    the placement of the opening parenthesis, and so whether "sounding in
    rescission" limits the claims reserved to the investor or merely illustrates
    them

readings:
  - id: A
    advanced_by: West Bromwich Building Society, and the Court of Appeal
    statement: >
      Read as written. "Any claim" is the antecedent, and "or otherwise" inside the
      parenthesis stops the parenthesis narrowing it, so claims of every kind were
      reserved to the investors and never assigned to the Scheme.
  - id: B
    advanced_by: The Investors Compensation Scheme
    statement: >
      Read as though the bracket opened one word earlier: "Any claim sounding in
      rescission (whether for undue influence or otherwise)". Only rescission
      claims were reserved, so the damages claims passed to the Scheme.
    adopted: true

resolution:
  outcome: B
  basis: [commercial-absurdity, structural-context]
  court_declared_ambiguous: true
  quote: >
    If one applies these principles, it seems to me that the judge must be right
    and, as we are dealing with one badly drafted clause which is happily no longer
    in use, there is little advantage in my repeating his reasons at greater
    length. ... Secondly, Leggatt L.J. said that the judge's construction was not
    an "available meaning" of the words. If this means that judges cannot, short of
    rectification, decide that the parties must have made mistakes of meaning or
    syntax, I respectfully think he was wrong.

stakes:
  kind: money
  note: >
    Whether thousands of Home Income Plan investors kept their damages claims
    against the building society or had assigned them to the Scheme along with
    their rescission claims. The specimen claim form in evidence recorded a
    compensation payment of £20,345.15 to one investor.
  documented: true

minimal_fix:
  edit: >
    Move the opening bracket one word to the left: "Any claim sounding in
    rescission (whether for undue influence or otherwise)". That is exactly the
    rearrangement the House of Lords performed, and it is the whole dispute.
  suffices_without_facts: true

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  boundary: true
  notes: >
    A boundary specimen and the direct counterpart to chef-america-heating-to. The
    two cases pose the same question, whether a court may repair defective drafting
    rather than enforce it, and answer it oppositely. Hoffmann held that judges
    can, short of rectification, decide the parties used the wrong syntax; the
    Federal Circuit construed a claim as written even though doing so incinerated
    the product. Both courts knew exactly what they were choosing.
    Two details make this the better half of the pairing. Hoffmann declined even to
    accept that he was straining the words: answering the trial judge's worry about
    "doing violence" to their natural meaning, he replied that many people
    "including politicians, celebrities and Mrs. Malaprop, mangle meanings and
    syntax but nevertheless communicate tolerably clearly what they are using the
    words to mean", and that "if anyone is doing violence to natural meanings, it
    is they rather than their listeners". And Lord Lloyd, dissenting, denied there
    was any ambiguity at all: the difficulty arose "not from any obscurity of the
    language (the meaning is, I think, tolerably clear) but from slovenly
    drafting". One clause, and the House divided on whether it was even unclear.

