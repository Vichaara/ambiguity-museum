id: chef-america-heating-to
title: Heat the dough to 850°F and see what happens

case:
  name: Chef America, Inc. v. Lamb-Weston, Inc.
  citation: 358 F.3d 1371
  court: United States Court of Appeals for the Federal Circuit
  jurisdiction: US-federal
  date: "2004-02-20"
  judge: Friedman, Senior Circuit Judge (with Rader and Schall, JJ.)

instrument:
  type: patent-claim
  provision: "'290 patent, process claim, the heating step"
  drafted_by: >
    The patentees. The court found the prosecution history showed they used "to"
    deliberately.

mechanism:
  primary: preposition
  secondary: [modifier-scope]

disputed_text:
  quote: >
    heating the resulting batter-coated dough to a temperature in the range of
    about 400° F. to 850° F.
  locus: the preposition "to", as against "at"
readings:
  - id: A
    advanced_by: Chef America
    statement: >
      The claim specifies the temperature *at* which the dough is heated, i.e.
      the oven temperature. Reading it otherwise destroys the product the patent
      exists to make.
  - id: B
    advanced_by: Lamb-Weston / the district court
    statement: >
      The claim means what it says: the dough itself is raised to 400-850°F.
      The claim does not mention an oven at all.
    adopted: true

decisions:
  - court: United States District Court, on claim construction
    known_from: reported-above
    adopted: B
    declared_ambiguous: null
    disposition: first-instance
  - court: United States Court of Appeals for the Federal Circuit
    known_from: read
    citation: 358 F.3d 1371
    date: "2004-02-20"
    adopted: B
    declared_ambiguous: false
    disposition: affirmed
    quote: >
      we construe the claim as written, not as the patentees wish they had written it
    pinpoint: 358 F.3d at 1372-73, Part II-A

resolution:
  outcome: B
  basis: [construed-as-written, plain-meaning]
  court_declared_ambiguous: false
  quote: >
    Thus, in accord with our settled practice we construe the claim as written,
    not as the patentees wish they had written it. As written, the claim
    unambiguously requires that the dough be heated to a temperature range of
    400° F. to 850° F.
stakes:
  kind: property
  note: >
    Summary judgment of non-infringement. The construction rendered the claim
    commercially worthless, since nothing practising the patent as written could work.
  documented: true

preventive_edits:
  - forces: A
    edit: >
      One preposition: "heating the resulting batter-coated dough at a temperature in
      the range of about 400° F. to 850° F."
    plausible_intent: true
    changes_bargain: >
      Describes the oven, which is what the process requires and what the patent was
      worth.
  - forces: B
    edit: >
      Say the dough itself is the thing heated: "heating the resulting batter-coated
      dough until the dough reaches a temperature in the range of about 400° F. to
      850° F."
    plausible_intent: false
    changes_bargain: >
      Reconstructs an intention nobody held. The court enforced this reading while
      accepting that it produces what an attorney in the case called a charcoal
      briquet. The edit is draftable and was never going to be drafted, and it is
      recorded to show the winning construction was a possible parse rather than a
      possible bargain.

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  boundary:
    tests: [refusal-to-find-ambiguity]
    against_inclusion: >
      The court held the claim "susceptible to only one reasonable interpretation". If
      one reading is the only reasonable one, the text is not ambiguous, and the exhibit
      fails test (a) on the deciding court's own account. Chef America's construction
      was not a rival reading the court weighed and rejected; it was a reading the court
      said the words could not bear.
    why_included: >
      Two readings were argued, briefed, and dispositive of the appeal, and the court
      chose between them while conceding the winner produces a charcoal briquet. A
      declaration that text is unambiguous is a holding about the words, not an
      observation of a fact, and the gap between the two is a large part of what this
      collection is for. Six of twelve exhibits sit on the same side of it.
  notes: >
    A boundary specimen, and the counterpart to ics-west-bromwich: the same question
    answered the other way. The court conceded the result was absurd: the
    dough "would be burned to a crisp," producing something an attorney in the case
    called a charcoal briquet. It enforced the claim anyway, holding it
    "susceptible to only one reasonable interpretation." Whether that makes this
    an ambiguity case or a refusal to find one is exactly the question worth
    arguing about, which is why it is here and labelled.

