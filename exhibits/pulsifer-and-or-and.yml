id: pulsifer-and-or-and
title: Does "does not have A, B, and C" mean all three, or each of three?

case:
  name: Pulsifer v. United States
  citation: 601 U.S. 124
  docket: 22-340
  court: Supreme Court of the United States
  jurisdiction: US-federal
  date: "2024-03-15"

instrument:
  type: statute
  provision: First Step Act safety valve, 18 U.S.C. §3553(f)(1)
  drafted_by: Congress, 2018

mechanism:
  primary: negation-scope
  secondary: [conjunction-disjunction, list-scope]

disputed_text:
  quote: >
    the defendant does not have— (A) more than 4 criminal history points,
    excluding any criminal history points resulting from a 1-point offense, as
    determined under the sentencing guidelines; (B) a prior 3-point offense, as
    determined under the sentencing guidelines; and (C) a prior 2-point violent
    offense, as determined under the sentencing guidelines
  locus: >
    how the negation "does not have" distributes across an "and"-joined list of
    three disqualifiers

  pinpoint: >
    18 U.S.C. 3553(f)(1), set out in Part I of the majority opinion
readings:
  - id: A
    advanced_by: Pulsifer
    statement: >
      The defendant is disqualified only if he has the full combination of A and
      B and C together. Any lesser record leaves the safety valve open.
  - id: B
    advanced_by: The Government
    statement: >
      "Does not have" distributes across the list, so each of A, B and C
      independently disqualifies. Far fewer defendants can reach the safety
      valve.
    adopted: true

decisions:
  - court: United States Court of Appeals for the Eighth Circuit
    citation: 39 F.4th 1018
    known_from: inferred
    adopted: B
    declared_ambiguous: null
    disposition: first-instance
  - court: Supreme Court of the United States
    known_from: read
    citation: 601 U.S. 124
    date: "2024-03-15"
    adopted: B
    declared_ambiguous: false
    disposition: affirmed
    quote: >
      There are, to be sure, two grammatically permissible readings of the statute when
      viewed in the abstract
    pinpoint: the majority opinion, conceding the point before resolving it on context

resolution:
  outcome: B
  basis: [surplusage, structural-context]
  court_declared_ambiguous: false
  quote: >
    There are, to be sure, two grammatically permissible readings of the statute
    when viewed in the abstract...But the difficulty in choosing between those
    two constructions falls away once we consider the content of Subparagraphs
    A, B, and C

  pinpoint: >
    majority opinion, at "There are, to be sure, two grammatically permissible
    readings"
stakes:
  kind: liberty
  note: >
    The safety valve permits a sentence below an otherwise mandatory minimum.
    The reading determines which defendants may seek one; the opinion states no
    single figure.
  documented: false

preventive_edits:
  - forces: A
    edit: >
      Say the list is conjunctive: "the defendant does not have all of the following",
      followed by subparagraphs A, B and C.
    plausible_intent: true
    changes_bargain: >
      Opens the safety valve to any defendant lacking the full combination, so many
      more defendants escape the mandatory minimum.
  - forces: B
    edit: >
      Make the list disjunctive: replace "and" before subparagraph C with "or", so the
      negation distributes across each item.
    plausible_intent: true
    changes_bargain: >
      Each item disqualifies on its own, closing the valve to most defendants carrying
      any of the three records.

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  boundary:
    tests: [refusal-to-find-ambiguity]
    against_inclusion: >
      The majority declined to call the provision ambiguous for the purposes of the rule
      of lenity, holding the choice resolvable once the content of the subparagraphs is
      considered. If context settles it, there is one reading the statute bears and no
      ambiguity to collect.
    why_included: >
      The same opinion concedes there are "two grammatically permissible readings of the
      statute when viewed in the abstract". That concession is the exhibit. What follows
      is a court resolving an ambiguity it has declined to name, which is a different
      thing from a text that was never ambiguous.
  notes: >
    A boundary specimen for an unusual reason. The Court expressly conceded
    "two grammatically permissible readings" existed on the face of the text,
    yet declined to call the provision ambiguous for purposes of the rule of
    lenity, holding the choice resolvable by context. Sits in the "declared
    clear" wing on the strength of that refusal: conceded ambiguity in the
    grammar, denied ambiguity in law.

