id: facebook-duguid-series-qualifier
title: One modifier, two verbs. Which does it reach?

case:
  name: Facebook, Inc. v. Duguid
  citation: 592 U.S. 395
  docket: 19-511
  court: Supreme Court of the United States
  jurisdiction: US-federal
  date: "2021-04-01"
  judge: Sotomayor, J. (Alito, J., concurring in the judgment)
  prior_history: Reversing 926 F.3d 1146 (9th Cir.).

instrument:
  type: statute
  provision: TCPA autodialer definition, 47 U.S.C. §227(a)(1)(A)-(B)
  drafted_by: Congress, 1991

mechanism:
  primary: series-qualifier
  secondary: [modifier-scope]

disputed_text:
  quote: >
    (A) to store or produce telephone numbers to be called, using a random or
    sequential number generator; and (B) to dial such numbers.
  locus: >
    the trailing participial phrase "using a random or sequential number
    generator", and the comma that precedes it

  pinpoint: >
    47 U.S.C. 227(a)(1)(A)-(B), quoted in Part I of the slip opinion
readings:
  - id: A
    advanced_by: Facebook
    statement: >
      The clause modifies both verbs. Equipment is an autodialer only if it
      stores or produces numbers *using a number generator*, which most modern
      marketing systems do not.
    adopted: true
  - id: B
    advanced_by: Duguid
    statement: >
      The clause modifies only "produce," the nearest verb. Equipment that
      merely stores numbers and dials them is an autodialer, sweeping in a far
      wider class of systems.

decisions:
  - court: United States Court of Appeals for the Ninth Circuit
    known_from: read
    citation: 926 F.3d 1146
    date: "2019-06-13"
    adopted: B
    declared_ambiguous: true
    disposition: first-instance
    quote: >
      To clarify any ambiguity, we rearticulated the definition of an ATDS: "equipment
      which has the capacity—(1) to store numbers to be called or (2) to produce numbers
      to be called, using a random or sequential number generator—and to dial such
      numbers automatically." Id. at 1053. That definition governs this appeal.
    pinpoint: >
      926 F.3d 1146, Part I, the panel explaining why the circuit had rearticulated the
      definition in Marks v. Crunch San Diego, LLC, 904 F.3d 1041, 1053. The sentence
      describes the circuit's earlier act rather than announcing a holding on ambiguity,
      which is why it is quoted in full here
  - court: Supreme Court of the United States
    known_from: read
    citation: 592 U.S. 395
    date: "2021-04-01"
    adopted: A
    declared_ambiguous: false
    disposition: reversed
    quote: >
      We conclude that the clause modifies both, specifying how the equipment must
      either "store" or "produce" telephone numbers.
    pinpoint: slip op., Part II-A

resolution:
  outcome: A
  basis: [structural-context, plain-meaning]
  court_declared_ambiguous: false
  quote: >
    Facebook argues the clause "using a random or sequential number generator"
    modifies both verbs that precede it ("store" and "produce"), while Duguid
    contends it modifies only the closest one ("produce"). We conclude that the
    clause modifies both, specifying how the equipment must either "store" or
    "produce" telephone numbers.

  pinpoint: >
    slip op., Part II-A, at "Facebook argues the clause"
stakes:
  kind: money
  amount: unstated in the opinion
  note: >
    The TCPA carries statutory damages per call, so the scope of one participial
    phrase governs the exposure of every company operating an automated
    messaging system. The opinion does not quantify it.
  documented: false

preventive_edits:
  - forces: A
    edit: >
      Front the modifier so it cannot attach to a single verb: "using a random or
      sequential number generator, to store or produce telephone numbers to be called".
    plausible_intent: true
    changes_bargain: >
      Keeps the definition narrow. Equipment that merely stores a list and dials it
      falls outside the Act, and most modern platforms escape liability.
  - forces: B
    edit: >
      Give each verb its own object and attach the modifier to one of them: "to store
      telephone numbers to be called, or to produce telephone numbers to be called
      using a random or sequential number generator".
    plausible_intent: true
    changes_bargain: >
      Sweeps in any system that stores and dials, exposing a far wider class of
      businesses to statutory damages assessed per call.

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  notes: >
    The Court enumerates both parses itself, in one sentence, before choosing.
    Nothing about Facebook's actual conduct bore on the question.

sources:
  - url: https://www.supremecourt.gov/opinions/20pdf/19-511_p86b.pdf
    archived: https://web.archive.org/web/20260702224929/https://www.supremecourt.gov/opinions/20pdf/19-511_p86b.pdf
    kind: primary
    confirms: [citation, disputed_text, readings, resolution, prior_history]
    retrieved: "2026-07-29"

verification:
  status: confirmed
  checked_on: "2026-07-29"

