id: white-city-v-pr-restaurants
title: Is a burrito a sandwich?

case:
  name: White City Shopping Center, LP v. PR Restaurants, LLC
  citation: 21 Mass. L. Rptr. 565
  parallel_citations: ["2006 WL 3292641"]
  docket: "2006196313"
  court: Massachusetts Superior Court
  jurisdiction: US-MA
  date: "2006-10-31"
  judge: Jeffrey A. Locke

instrument:
  type: lease
  provision: Lease §4.07 (exclusivity clause)
  drafted_by: >
    PR Restaurants, the tenant who later sued on it and lost. The court noted the
    clause "underwent three revisions prior to the Lease's execution" and still
    arrived without a definition of its central word.

mechanism:
  primary: undefined-term
  secondary: [lexical-polysemy]

disputed_text:
  quote: >
    Landlord agrees not to enter into a lease, occupancy agreement or license
    affecting space in the Shopping Center ... for a bakery or restaurant
    reasonably expected to have annual sales of sandwiches greater than ten
    percent (10%) of its total sales ...
  locus: the undefined noun "sandwiches"

  pinpoint: >
    21 Mass. L. Rptr. at 566, Lease section 4.07 as set out in the Background
readings:
  - id: A
    advanced_by: PR Restaurants (Panera)
    statement: >
      "Sandwiches" covers any filling enclosed in bread, so burritos, tacos and
      quesadillas count and Qdoba is excluded from the shopping centre.
  - id: B
    advanced_by: White City / Chair 5 (Qdoba)
    statement: >
      "Sandwiches" means the two-slices-of-bread article of ordinary speech.
      A single rolled tortilla is not one, so Qdoba may open.
    adopted: true

resolution:
  outcome: B
  basis: [ordinary-meaning, dictionary, construed-as-written]
  court_declared_ambiguous: false
  quote: >
    Given that the term "sandwiches" is not ambiguous and the Lease does not
    provide a definition of it, this court applies the ordinary meaning of the
    word. ... Under this definition and as dictated by common sense, this court
    finds that the term "sandwich" is not commonly understood to include
    burritos, tacos, and quesadillas, which are typically made with a single
    tortilla and stuffed with a choice filling of meat, rice, and beans.

  pinpoint: >
    21 Mass. L. Rptr. at 567, section A of the Discussion
stakes:
  kind: money
  amount: USD 385,000+ committed by the incoming tenant
  note: >
    Chair 5 had spent over $85,000 in planning and was contractually obliged to
    spend over $300,000 on construction. The larger stake was PR's exclusivity
    right for the balance of a ten-year lease.
  documented: true

preventive_edits:
  - forces: A
    edit: >
      Define the term broadly: "for the purposes of this Section, 'sandwich' includes
      any filling wrapped or enclosed in any bread product, including tortillas, wraps
      and flatbreads".
    plausible_intent: true
    changes_bargain: >
      Widens the exclusivity to most fast-casual food. Worth considerably more to the
      tenant, and it costs the landlord tenants it could otherwise sign.
  - forces: B
    edit: >
      Define it narrowly: "'sandwich' means a filling between two slices of bread or a
      split roll, and does not include burritos, tacos, quesadillas or other filled
      tortillas".
    plausible_intent: true
    changes_bargain: >
      Confines the exclusivity to conventional sandwiches and leaves the landlord free
      to let to Mexican-style restaurants.

inclusion_test:
  discrete_readings: true
  fixable_by_text_alone: true
  not_vagueness: true
  boundary:
    tests: [vagueness, refusal-to-find-ambiguity]
    against_inclusion: >
      This is the most contestable inclusion in the collection. A burrito is a borderline
      case of "sandwich", and borderline cases of an open-textured predicate are the
      definition of vagueness, which the collection excludes by rule. The court agreed
      the term was not ambiguous, and reached its answer by consulting a dictionary,
      which is how one resolves vagueness rather than how one chooses between parses.
    why_included: >
      The dispute was not about where a boundary falls. Both sides advanced discrete,
      statable definitions, two slices of bread against any filling enclosed in any bread
      product, and the case turned on which definition governed rather than on whether a
      particular item shaded across a line. A word can be vague at its edges and
      ambiguous between two settled senses; this was the second. A reader who thinks that
      distinction too fine should treat this exhibit as the collection's weakest and say
      so.
  notes: >
    Included in the "declared clear" wing rather than the core. The court held the
    word NOT ambiguous, so on its own account this is not an ambiguity case at all.
    It earns its place for the opposite reason: footnote 3 records that "the parties
    have submitted numerous dictionary definitions for the term 'sandwich,' as well
    as expert affidavits", competing definitions and paid experts on both sides,
    and the court still called the term unambiguous in the next breath. That gap
    between declared clarity and demonstrated disagreement IS the exhibit.

sources:
  - url: https://www.courtlistener.com/opinion/8356298/white-city-shopping-center-v-pr-restaurants-llc/
    kind: near-primary
    confirms: [citation, disputed_text, readings, resolution, stakes]
    retrieved: "2026-07-29"
verification:
  status: confirmed
  checked_on: "2026-07-29"
  open_questions:
    - >
      The opinion attributes its definition to "The New Webster Third International
      Dictionary ... Merriam-Webster, 2002", which conflates two different
      dictionaries. Reproduce the court's wording as written and footnote the slip;
      do not silently correct it.

pairs_with: [wtc-one-occurrence-or-two]
tags: [food, retail, exclusivity, declared-clear]
